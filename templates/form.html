<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Price Prediction Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Enter Diamond Details</h1>
        <form action="{{url_for('predict_datapoint')}}" method="POST">
            <label for="carat">Carat:</label>
            <input type="text" id="carat" name="carat" placeholder="Enter carat value" required>

            <label for="depth">Depth:</label>
            <input type="text" id="depth" name="depth" placeholder="Enter depth percentage" required>

            <label for="table">Table:</label>
            <input type="text" id="table" name="table" placeholder="Enter table percentage" required>

            <label for="x">X Dimension (mm):</label>
            <input type="text" id="x" name="x" placeholder="Enter x dimension" required>

            <label for="y">Y Dimension (mm):</label>
            <input type="text" id="y" name="y" placeholder="Enter y dimension" required>

            <label for="z">Z Dimension (mm):</label>
            <input type="text" id="z" name="z" placeholder="Enter z dimension" required>

            <label for="cut">Cut:</label>
            <select id="cut" name="cut">
                <option value="Fair">Fair</option>
                <option value="Good">Good</option>
                <option value="Very Good">Very Good</option>
                <option value="Premium">Premium</option>
                <option value="Ideal">Ideal</option>
            </select>

            <label for="color">Color:</label>
            <select id="color" name="color">
                <option value="J">J</option>
                <option value="I">I</option>
                <option value="H">H</option>
                <option value="G">G</option>
                <option value="F">F</option>
                <option value="E">E</option>
                <option value="D">D</option>
            </select>

            <label for="clarity">Clarity:</label>
            <select id="clarity" name="clarity">
                <option value="I1">I1</option>
                <option value="SI2">SI2</option>
                <option value="SI1">SI1</option>
                <option value="VS2">VS2</option>
                <option value="VS1">VS1</option>
                <option value="VVS2">VVS2</option>
                <option value="VVS1">VVS1</option>
                <option value="IF">IF</option>
            </select>

            <button type="submit" class="btn">Predict Price</button>
        </form>
    </div>

</body>
</html>
